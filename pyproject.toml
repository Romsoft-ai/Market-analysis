[project]
name = "marketlab"
version = "0.1.0"
description = "Plateforme de collecte et d'analyse de données financières, et bot de trading associé"
requires-python = ">=3.12"

dependencies = [
    "MetaTrader5",      # source des prix et exécution des ordres (Windows uniquement)
    "pandas",           # manipulation des séries de bougies
    "numpy",
    "python-dotenv",    # lecture du fichier .env
    "PyYAML",           # lecture des fichiers de configuration
    "markdown",         # conversion des documents en PDF
    "pyarrow",          # lecture et écriture des fichiers Parquet
    "streamlit",        # interface d'inspection des trades
    "plotly",           # graphiques interactifs
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",             # formatage et vérification du code
    "ipykernel",        # notebooks
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
